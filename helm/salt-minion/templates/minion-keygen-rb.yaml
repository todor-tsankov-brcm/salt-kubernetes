{{- if and .Values.rbac.create (eq .Values.agent.authMode "in_cluster") (not .Values.agent.minion.keySecretName) (not .Values.agent.minion.privateKeyB64) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-minion-keygen-rb
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-minion-keygen-role
{{- end }}