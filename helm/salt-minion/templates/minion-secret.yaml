{{- include "salt-minion.validateKeyPair" . -}}
{{- if include "salt-minion.keySecretEnabled" . }}
{{- $secretName := include "salt-minion.keySecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salt-minion
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  minion.pem: {{ .Values.agent.minion.privateKeyB64 | quote }}
  minion.pub: {{ .Values.agent.minion.publicKeyB64 | quote }}
{{- end }}
