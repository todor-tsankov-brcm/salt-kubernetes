{{- $secretName := include "salt-minion.keySecretName" . -}}
{{- if include "salt-minion.inlineSecretEnabled" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salt-minion
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  {{ include "salt-minion.privateKeyFile" . }}: {{ .Values.agent.minion.privateKeyB64 | quote }}
  {{ include "salt-minion.publicKeyFile" . }}: {{ .Values.agent.minion.publicKeyB64 | quote }}
{{- end }}
