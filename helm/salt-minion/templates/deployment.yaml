{{- include "salt-minion.validate" . }}
{{- if eq .Values.agent.authMode "in_cluster" }}
{{- $keySecret := include "salt-minion.keySecretName" . }}
{{- $agentImage := include "salt-minion.agentImage" . }}
{{- $keyVolume := "minion-keys-source" }}
{{- $keyMountPath := "/var/run/salt-minion-keys" }}
{{- $pkiVolume := "minion-pki" }}
{{- $pkiSubPath := "minion" }}
{{- $dataVolume := "minion-data" }}
{{- $appName := "salt-minion" }}
{{- $privateKey := include "salt-minion.privateKeyFile" . }}
{{- $publicKey := include "salt-minion.publicKeyFile" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ $appName }}
    app.kubernetes.io/name: {{ $appName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.agent.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $appName }}
  template:
    metadata:
      annotations:
        checksum/extra-config: {{ .Values.agent.extraConfigMaps | toJson | sha256sum }}
        {{- if .Values.agent.minion.privateKeyB64 }}
        checksum/inline-keys: {{ list .Values.agent.minion.privateKeyB64 .Values.agent.minion.publicKeyB64 | toJson | sha256sum }}
        {{- end }}
      labels:
        app: {{ $appName }}
        app.kubernetes.io/name: {{ $appName }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.agent.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}

      initContainers:
        - name: prepare-minion-keys
          image: {{ $agentImage | quote }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: SALT_PKI_DIR
              value: {{ .Values.agent.minion.pkiDir | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077
              pki="$SALT_PKI_DIR/{{ $pkiSubPath }}"
              mkdir -p "$pki"
              chmod 0700 "$pki"
              # Remove old keys to avoid retaining a key from a different pair.
              rm -f "$pki/{{ $privateKey }}" "$pki/{{ $publicKey }}"
              cp {{ $keyMountPath }}/{{ $privateKey }} "$pki/{{ $privateKey }}"
              cp {{ $keyMountPath }}/{{ $publicKey }} "$pki/{{ $publicKey }}"
              test -s "$pki/{{ $privateKey }}"
              test -s "$pki/{{ $publicKey }}"
              chmod 0400 "$pki/{{ $privateKey }}"
              chmod 0644 "$pki/{{ $publicKey }}"
          volumeMounts:
            - name: {{ $keyVolume }}
              mountPath: {{ $keyMountPath }}
              readOnly: true
            - name: {{ $pkiVolume }}
              mountPath: {{ .Values.agent.minion.pkiDir | quote }}
          securityContext:
            {{- toYaml .Values.agent.containerSecurityContext | nindent 12 }}
        {{- if .Values.agent.dataPersistence.enabled }}
        - name: validate-data-store
          image: {{ $agentImage | quote }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: ["/bin/sh", "-ec", "test -w /data || { echo 'Data volume is not writable; check storage ownership and fsGroup' >&2; exit 1; }"]
          securityContext:
            {{- toYaml .Values.agent.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: {{ $dataVolume }}
              mountPath: /data
        {{- end }}

      containers:
        - name: salt-minion
          image: {{ $agentImage | quote }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: SALT_PKI_DIR
              value: {{ .Values.agent.minion.pkiDir | quote }}
            - name: SALT_MASTER
              {{- if kindIs "slice" .Values.agent.saltMasterHost }}
              value: {{ join "," .Values.agent.saltMasterHost | quote }}
              {{- else }}
              value: {{ .Values.agent.saltMasterHost | quote }}
              {{- end }}

            - name: SALT_MASTER_PORT
              value: {{ .Values.agent.saltMasterPort | quote }}

            - name: SALT_PUBLISH_PORT
              value: {{ .Values.agent.saltPublishPort | quote }}

            - name: SALT_AUTH_TIMEOUT
              value: {{ .Values.agent.authTimeout | quote }}

            - name: SALT_MASTER_ALIVE_INTERVAL
              value: {{ .Values.agent.masterAliveInterval | quote }}

            - name: SALT_RECON_DEFAULT
              value: {{ .Values.agent.reconDefault | quote }}

            - name: SALT_RECON_MAX
              value: {{ .Values.agent.reconMax | quote }}

            - name: SALT_RECON_RANDOMIZE
              value: {{ .Values.agent.reconRandomize | quote }}

            {{- if .Values.agent.minion.id }}
            - name: SALT_MINION_ID
              value: {{ .Values.agent.minion.id | quote }}
            {{- end }}

            {{- if .Values.agent.minion.masterPubKeyB64 }}
            - name: SALT_MASTER_PUBKEY_B64
              value: {{ .Values.agent.minion.masterPubKeyB64 | quote }}
            {{- end }}

            - name: SALT_LOG_LEVEL
              value: {{ default "info" .Values.agent.logLevel | quote }}

            - name: VAULT_ADDR
              value: {{ .Values.agent.vault.addr | quote }}

            - name: VAULT_AUTH_METHOD
              value: {{ .Values.agent.vault.authMethod | quote }}

            - name: VAULT_ROLE_ID
              value: {{ .Values.agent.vault.roleId | quote }}

            - name: VAULT_SECRET_ID
              value: {{ .Values.agent.vault.secretId | quote }}

            - name: VAULT_SECRET_ID_FILE
              value: {{ .Values.agent.vault.secretIdFile | quote }}

            - name: VAULT_TOKEN
              value: {{ .Values.agent.vault.token | quote }}

            - name: VAULT_TOKEN_FILE
              value: {{ .Values.agent.vault.tokenFile | quote }}

            - name: VAULT_SDB_PROFILE
              value: {{ .Values.agent.vault.sdbProfile | quote }}

          volumeMounts:
            - name: {{ $pkiVolume }}
              mountPath: {{ .Values.agent.minion.pkiDir | quote }}
              subPath: {{ $pkiSubPath }}
            {{- range $index, $config := .Values.agent.extraConfigMaps }}
            {{- if .mountPath }}
            - name: {{ include "salt-minion.configVolumeName" $index | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
              {{- with .key }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.agent.dataPersistence.enabled }}
            - name: {{ $dataVolume }}
              mountPath: {{ required "agent.dataPersistence.mountPath is required" .Values.agent.dataPersistence.mountPath | quote }}
            {{- end }}
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          livenessProbe:
            exec:
              command:
                - salt-call
                - --local
                - test.ping
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - salt-call
                - --local
                - test.ping
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          securityContext:
            {{- toYaml .Values.agent.containerSecurityContext | nindent 12 }}

      volumes:
        - name: {{ $keyVolume }}
          secret:
            secretName: {{ $keySecret }}
            defaultMode: 0440
        {{- range $index, $config := .Values.agent.extraConfigMaps }}
        {{- if .mountPath }}
        - name: {{ include "salt-minion.configVolumeName" $index | quote }}
          configMap:
            name: {{ .name | quote }}
        {{- end }}
        {{- end }}

        - name: {{ $pkiVolume }}
          {{- if not .Values.agent.persistence.enabled }}
          emptyDir: {}
          {{- else if eq .Values.agent.persistence.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "salt-minion.pkiClaimName" . | quote }}
          {{- else }}
          hostPath:
            path: {{ required "agent.persistence.hostPath.path is required" .Values.agent.persistence.hostPath.path | quote }}
            type: Directory
          {{- end }}
        {{- if .Values.agent.dataPersistence.enabled }}
        - name: {{ $dataVolume }}
          persistentVolumeClaim:
            claimName: {{ include "salt-minion.dataClaimName" . | quote }}
        {{- end }}
        {{- with .Values.agent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
