suite: keygen Role
templates:
  - templates/minion-keygen-role.yaml
tests:
  - it: creates the resource when key generation is enabled
    set:
      agent.minion.allowSelfGeneratedKey: true
    asserts:
      - hasDocuments:
          count: 1

  - it: does not create the resource for an existing Secret
    set:
      agent.minion.keySecretName: existing-keys
      agent.minion.allowSelfGeneratedKey: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create the resource for keys supplied through Helm values
    set:
      agent.minion.privateKeyB64: cHJpdmF0ZQ==
      agent.minion.publicKeyB64: cHVibGlj
      agent.minion.allowSelfGeneratedKey: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create the resource in external mode
    set:
      agent.authMode: external
      agent.minion.allowSelfGeneratedKey: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create the resource when generation is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create the resource when RBAC is managed externally
    set:
      agent.minion.allowSelfGeneratedKey: true
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
