suite: minion secret
templates:
  - templates/minion-secret.yaml
tests:
  - it: stores base64 key values under the mounted PEM filenames
    set:
      agent.minion.privateKeyB64: cHJpdmF0ZQ==
      agent.minion.publicKeyB64: cHVibGlj
    asserts:
      - equal:
          path: data
          value:
            minion.pem: cHJpdmF0ZQ==
            minion.pub: cHVibGlj

  - it: does not create a Secret without keys supplied through Helm values
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a private key without a public key
    set:
      agent.minion.privateKeyB64: cHJpdmF0ZQ==
    asserts:
      - failedTemplate:
          errorMessage: agent.minion.privateKeyB64 and agent.minion.publicKeyB64 must be set together

  - it: rejects a public key without a private key
    set:
      agent.minion.publicKeyB64: cHVibGlj
    asserts:
      - failedTemplate:
          errorMessage: agent.minion.privateKeyB64 and agent.minion.publicKeyB64 must be set together
