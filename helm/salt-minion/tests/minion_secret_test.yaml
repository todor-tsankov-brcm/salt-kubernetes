suite: inline minion Secret
templates:
  - templates/minion-secret.yaml
tests:
  - it: preserves both inline Secret entries
    set:
      agent.minion.privateKeyB64: cHJpdmF0ZQ==
      agent.minion.publicKeyB64: cHVibGlj
    asserts:
      - equal:
          path: data.private-key-b64
          value: Y0hKcGRtRjBaUT09
      - equal:
          path: data.public-key-b64
          value: Y0hWaWJHbGo=

  - it: does not create an inline Secret without keys
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a private key without a public key
    set:
      agent.minion.privateKeyB64: cHJpdmF0ZQ==
    asserts:
      - failedTemplate:
          errorMessage: agent.minion.privateKeyB64 and agent.minion.publicKeyB64 must be set together

  - it: rejects a public key without a private key
    set:
      agent.minion.publicKeyB64: cHVibGlj
    asserts:
      - failedTemplate:
          errorMessage: agent.minion.privateKeyB64 and agent.minion.publicKeyB64 must be set together
